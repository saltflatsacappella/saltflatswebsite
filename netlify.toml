# Netlify configuration for saltflatsacappella.org
# The site is plain HTML/CSS/JS in /public. No build step.

[build]
  publish = "public"
  command = ""

# Redirect the old single-file hash routes to real pages.
# (Hash fragments never reach the server, so these only catch the bare paths.)
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/archive"
  to = "/archive/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/donate"
  to = "/donate/"
  status = 301

[[redirects]]
  from = "/book"
  to = "/contact/?book"
  status = 301

[[redirects]]
  from = "/support"
  to = "/donate/"
  status = 301

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for a year (including the Givebutter donation flow) so traffic can't be downgraded and intercepted.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Upgrade any stray http:// subresource to https://, block plugins, and stop other sites framing these pages.
    # Script/frame sources are left open so the Givebutter widget and its payment processors keep working.
    Content-Security-Policy = "upgrade-insecure-requests; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS and JS aren't fingerprinted, so keep their cache short; edits show up within the hour.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Images aren't fingerprinted either, so a replaced file must be able to refresh. Cache for a week, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
