  <main id="main" tabindex="-1">
    <section class="hero hero--archive">
      <img class="hero__bg" src="/images/photos/winter-concert.webp" alt="" width="1600" height="1200" fetchpriority="high">
      <div class="hero__inner">
        <h1 class="hero__title">Archive</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2 class="center">Watch</h2>
        <div class="video-grid">
          <figure class="video">
            <div class="video__frame" data-video-id="C0UhEMzmj68">
              <button class="video__play" type="button" aria-label="Play Winter Concert 2025">
                <img src="https://i.ytimg.com/vi/C0UhEMzmj68/maxresdefault.jpg" alt="" width="1280" height="720" loading="lazy">
              </button>
            </div>
            <figcaption class="video__caption">
              <span class="video__title">Winter Concert 2025</span>
              <a class="link" href="https://www.youtube.com/watch?v=C0UhEMzmj68" target="_blank" rel="noopener" aria-label="Watch Winter Concert 2025 on YouTube">Watch on YouTube</a>
            </figcaption>
          </figure>
          <figure class="video">
            <div class="video__frame" data-video-id="vsWZBVazfX4">
              <button class="video__play" type="button" aria-label="Play ICCAs 2026">
                <img src="https://i.ytimg.com/vi/vsWZBVazfX4/maxresdefault.jpg" alt="" width="1280" height="720" loading="lazy">
              </button>
            </div>
            <figcaption class="video__caption">
              <span class="video__title">ICCAs 2026</span>
              <a class="link" href="https://www.youtube.com/watch?v=vsWZBVazfX4" target="_blank" rel="noopener" aria-label="Watch ICCAs 2026 on YouTube">Watch on YouTube</a>
            </figcaption>
          </figure>
          <figure class="video">
            <div class="video__frame" data-video-id="muyVb0OvmT8">
              <button class="video__play" type="button" aria-label="Play Spring Concert 2026">
                <img src="https://i.ytimg.com/vi/muyVb0OvmT8/maxresdefault.jpg" alt="" width="1280" height="720" loading="lazy">
              </button>
            </div>
            <figcaption class="video__caption">
              <span class="video__title">Spring Concert 2026</span>
              <a class="link" href="https://www.youtube.com/watch?v=muyVb0OvmT8" target="_blank" rel="noopener" aria-label="Watch Spring Concert 2026 on YouTube">Watch on YouTube</a>
            </figcaption>
          </figure>
        </div>
        <div class="center mt-4"><a class="btn btn--dark" href="https://www.youtube.com/@TheSaltFlats" target="_blank" rel="noopener">All videos on YouTube</a></div>
      </div>
    </section>

    <section class="section section--flush-top">
      <div class="container">
        <h2 class="center">Photos</h2>
        <div class="photo-grid photo-grid--two mt-4">
          <figure class="photo">
            <div class="photo__frame"><img src="/images/photos/spring-concert.webp" alt="Salt Flats A Cappella group photo at the spring concert, University of Utah" width="1600" height="1200" loading="lazy"></div>
            <figcaption>Spring concert</figcaption>
          </figure>
          <figure class="photo">
            <div class="photo__frame"><img src="/images/photos/winter-concert.webp" alt="Salt Flats A Cappella in Santa hats at the winter concert, standing on the block U" width="1200" height="1600" loading="lazy"></div>
            <figcaption>Winter concert</figcaption>
          </figure>
          <figure class="photo">
            <div class="photo__frame"><img src="/images/photos/competition-day.webp" alt="Salt Flats A Cappella in red throwing the U in a theater lobby on ICCA competition day" width="739" height="1600" loading="lazy"></div>
            <figcaption>Competition day</figcaption>
          </figure>
          <figure class="photo">
            <div class="photo__frame"><img src="/images/photos/retreat.webp" alt="Salt Flats members in red University of Utah shirts on a staircase at retreat" width="1200" height="1600" loading="lazy"></div>
            <figcaption>Retreat</figcaption>
          </figure>
        </div>
      </div>
